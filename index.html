<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="author" content="Guide Catholic" />
    <meta name="publisher" content="Guide Catholic" />

    <!-- Robots Meta Tags -->
    <meta data-rh="true" name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta data-rh="true" name="googlebot" content="index, follow" />
    <meta data-rh="true" name="bingbot" content="index, follow" />

    <meta name="application-name" content="Guide Catholic" />
    <meta name="apple-mobile-web-app-title" content="Guide Catholic" />
    <meta data-rh="true" property="og:type" content="website" />
    <meta data-rh="true" property="og:title" content="Guide Catholic - Catholic Faith, Prayer and Spiritual Growth" />
    <meta data-rh="true" property="og:description" content="Grow in Catholic faith with guides on prayer, sacraments, saints, Scripture, doctrine and spiritual life." />

      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Source+Sans+3:wght@300;400;500;600&display=swap"
    />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon-48.png" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon-192.png" sizes="192x192" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <style>
